  :root {
    --bg: #1a1b26;
    --panel: #24283b;
    --line: #3b4261;
    --text: #c0caf5;
    --muted: #7f88b3;
    --accent: #7aa2f7;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
  }

  main {
    flex: 1;
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 24px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  /* The one bold element: the name, set in the Omarchy block letters */
  .stage {
    min-height: 38vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 0;
    border-bottom: 1px solid var(--line);
  }

  #preview {
    margin: 0;
    font-family: "Omarchy Font", monospace;
    font-weight: normal;
    font-size: clamp(40px, 11vw, 128px);
    line-height: 1.1;
    color: var(--text);
    text-align: center;
    word-break: break-word;
    overflow-wrap: anywhere;
    transition: color 0.2s;
  }
  #preview.empty { color: var(--line); }

  .controls {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: end;
  }

  label {
    display: block;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 6px;
  }

  input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    font: inherit;
    font-size: 18px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  input[type="text"]::placeholder { color: var(--muted); }
  input[type="text"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-color: var(--accent);
  }

  button {
    padding: 14px 22px;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    color: var(--bg);
    background: var(--accent);
    border: none;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { filter: brightness(1.1); }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  button:disabled {
    background: var(--line);
    color: var(--muted);
    cursor: not-allowed;
    filter: none;
  }

  .file {
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  .file-head {
    padding: 8px 14px;
    background: var(--panel);
    color: var(--muted);
    font-size: 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
  }
  .file pre {
    margin: 0;
    padding: 14px;
    min-height: 3em;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 13px;
    line-height: 1;
    white-space: pre;
    overflow-x: auto;
    color: var(--text);
  }

  #status {
    min-height: 1.5em;
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }
  #status.ok { color: #9ece6a; }
  #status.err { color: #f7768e; }

  footer {
    padding: 16px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
  footer a { color: var(--muted); }

  @media (max-width: 560px) {
    main { padding: 32px 16px; gap: 28px; }
    .controls { grid-template-columns: 1fr; }
    button { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

  // Build the block-character version of the text, exactly like the Omarchy wordmark.
  // Each glyph is a bitmap of half-rows; two half-rows pair up into one text line
  // using █ (both), ▀ (top only), ▄ (bottom only).
  function toBlockArt(text) {
    const n = GLYPHS["O"].r.length;
    let width = 4;
    const chars = [...text].map(ch => GLYPHS[ch] || GLYPHS[ch.toUpperCase()] || GLYPHS["?"]);
    chars.forEach(g => width += g.a);
    const grid = Array.from({ length: n }, () => new Array(width + 8).fill(0));
    let pen = 2;
    for (const g of chars) {
      g.r.forEach((row, i) => {
        for (let j = 0; j < row.length; j++) if (row[j] === "1") grid[i][pen + g.x + j] = 1;
      });
      pen += g.a;
    }
    let lines = [];
    for (let i = 0; i < n; i += 2) {
      let s = "";
      for (let c = 0; c < grid[i].length; c++) {
        const t = grid[i][c], b = grid[i + 1][c];
        s += t && b ? "\u2588" : t ? "\u2580" : b ? "\u2584" : " ";
      }
      lines.push(s.replace(/\s+$/, ""));
    }
    while (lines.length && !lines[0]) lines.shift();
    while (lines.length && !lines[lines.length - 1]) lines.pop();
    if (!lines.length) return "";
    const indent = Math.min(...lines.filter(l => l).map(l => l.length - l.trimStart().length));
    return lines.map(l => l.slice(indent)).join("\n");
  }

  const input = document.getElementById("nameInput");
  const preview = document.getElementById("preview");
  const btn = document.getElementById("downloadBtn");
  const contents = document.getElementById("fileContents");
  const byteCount = document.getElementById("byteCount");
  const status = document.getElementById("status");

  function update() {
    const value = input.value.trim();
    preview.textContent = value || "YOUR NAME";
    preview.classList.toggle("empty", !value);
    const art = toBlockArt(value);
    contents.textContent = art;
    const bytes = art ? new TextEncoder().encode(art + "\n").length : 0;
    byteCount.textContent = bytes + (bytes === 1 ? " byte" : " bytes");
    btn.disabled = !value;
    status.textContent = "";
    status.className = "";
  }

  function downloadFile() {
    const value = input.value.trim();
    if (!value) {
      status.textContent = "Type a name first — screensaver.txt can't be empty.";
      status.className = "err";
      input.focus();
      return;
    }
    const blob = new Blob([toBlockArt(value) + "\n"], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "screensaver.txt";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    status.textContent = 'Downloaded screensaver.txt with "' + value + '" in block letters.';
    status.className = "ok";
  }

  input.addEventListener("input", update);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") downloadFile(); });
  btn.addEventListener("click", downloadFile);
  update();
</script>
